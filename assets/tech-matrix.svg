<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 220" width="1100" height="220" role="img" aria-label="Tech Arsenal Bento Matrix">
  <defs>
    <linearGradient id="boxBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080d1a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="bGlow" x1="0%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="-1 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>

  <style>
    .cat { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; font-weight: 800; letter-spacing: 1px; }
    .pill { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12.5px; font-weight: 700; fill: #e2e8f0; }
  </style>

  <!-- Quadrant 1: Languages -->
  <g transform="translate(0, 0)">
    <rect width="540" height="102" rx="14" fill="url(#boxBg)" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1.4"/>
    <circle cx="22" cy="24" r="4" fill="#38bdf8"><animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/></circle>
    <text x="34" y="29" class="cat" fill="#7dd3fc">LANGUAGES</text>

    <g transform="translate(18, 46)">
      <rect x="0" y="0" width="66" height="34" rx="8" fill="#162036" stroke="#f59e0b" stroke-opacity="0.6"/>
      <circle cx="13" cy="17" r="3.5" fill="#f59e0b"/><text x="23" y="21.5" class="pill">Java</text>

      <rect x="74" y="0" width="94" height="34" rx="8" fill="#162036" stroke="#eab308" stroke-opacity="0.6"/>
      <circle cx="87" cy="17" r="3.5" fill="#eab308"/><text x="97" y="21.5" class="pill">JavaScript</text>

      <rect x="176" y="0" width="78" height="34" rx="8" fill="#162036" stroke="#3b82f6" stroke-opacity="0.6"/>
      <circle cx="189" cy="17" r="3.5" fill="#3b82f6"/><text x="199" y="21.5" class="pill">Python</text>

      <rect x="262" y="0" width="48" height="34" rx="8" fill="#162036" stroke="#06b6d4" stroke-opacity="0.6"/>
      <circle cx="275" cy="17" r="3.5" fill="#06b6d4"/><text x="285" y="21.5" class="pill">C</text>

      <rect x="318" y="0" width="62" height="34" rx="8" fill="#162036" stroke="#38bdf8" stroke-opacity="0.6"/>
      <circle cx="331" cy="17" r="3.5" fill="#38bdf8"/><text x="341" y="21.5" class="pill">C++</text>

      <rect x="388" y="0" width="72" height="34" rx="8" fill="#162036" stroke="#f97316" stroke-opacity="0.6"/>
      <circle cx="401" cy="17" r="3.5" fill="#f97316"/><text x="411" y="21.5" class="pill">HTML5</text>

      <rect x="468" y="0" width="58" height="34" rx="8" fill="#162036" stroke="#2563eb" stroke-opacity="0.6"/>
      <text x="497" y="21.5" text-anchor="middle" class="pill">CSS3</text>
    </g>
  </g>

  <!-- Quadrant 2: Frameworks & Libraries -->
  <g transform="translate(560, 0)">
    <rect width="540" height="102" rx="14" fill="url(#boxBg)" stroke="#a855f7" stroke-opacity="0.35" stroke-width="1.4"/>
    <circle cx="22" cy="24" r="4" fill="#a855f7"><animate attributeName="opacity" values="1;0.3;1" dur="2.3s" repeatCount="indefinite"/></circle>
    <text x="34" y="29" class="cat" fill="#d8b4fe">FRAMEWORKS &amp; LIBRARIES</text>

    <g transform="translate(18, 46)">
      <rect x="0" y="0" width="78" height="34" rx="8" fill="#162036" stroke="#38bdf8" stroke-opacity="0.6"/>
      <circle cx="13" cy="17" r="3.5" fill="#38bdf8"/><text x="23" y="21.5" class="pill">React</text>

      <rect x="88" y="0" width="112" height="34" rx="8" fill="#162036" stroke="#22c55e" stroke-opacity="0.6"/>
      <circle cx="101" cy="17" r="3.5" fill="#22c55e"/><text x="111" y="21.5" class="pill">Spring Boot</text>

      <rect x="210" y="0" width="88" height="34" rx="8" fill="#162036" stroke="#16a34a" stroke-opacity="0.6"/>
      <circle cx="223" cy="17" r="3.5" fill="#16a34a"/><text x="233" y="21.5" class="pill">Node.js</text>

      <rect x="308" y="0" width="114" height="34" rx="8" fill="#162036" stroke="#14b8a6" stroke-opacity="0.6"/>
      <circle cx="321" cy="17" r="3.5" fill="#14b8a6"/><text x="331" y="21.5" class="pill">Tailwind CSS</text>

      <rect x="432" y="0" width="72" height="34" rx="8" fill="#162036" stroke="#8b5cf6" stroke-opacity="0.6"/>
      <circle cx="445" cy="17" r="3.5" fill="#8b5cf6"/><text x="455" y="21.5" class="pill">Vite</text>
    </g>
  </g>

  <!-- Quadrant 3: Databases & Cloud -->
  <g transform="translate(0, 118)">
    <rect width="540" height="102" rx="14" fill="url(#boxBg)" stroke="#10b981" stroke-opacity="0.35" stroke-width="1.4"/>
    <circle cx="22" cy="24" r="4" fill="#10b981"><animate attributeName="opacity" values="1;0.3;1" dur="2.5s" repeatCount="indefinite"/></circle>
    <text x="34" y="29" class="cat" fill="#6ee7b7">DATABASES &amp; CLOUD SERVICES</text>

    <g transform="translate(18, 46)">
      <rect x="0" y="0" width="96" height="34" rx="8" fill="#162036" stroke="#3b82f6" stroke-opacity="0.6"/>
      <circle cx="13" cy="17" r="3.5" fill="#3b82f6"/><text x="23" y="21.5" class="pill">PostgreSQL</text>

      <rect x="103" y="0" width="68" height="34" rx="8" fill="#162036" stroke="#0ea5e9" stroke-opacity="0.6"/>
      <circle cx="116" cy="17" r="3.5" fill="#0ea5e9"/><text x="126" y="21.5" class="pill">MySQL</text>

      <rect x="178" y="0" width="88" height="34" rx="8" fill="#162036" stroke="#22c55e" stroke-opacity="0.6"/>
      <circle cx="191" cy="17" r="3.5" fill="#22c55e"/><text x="201" y="21.5" class="pill">MongoDB</text>

      <rect x="273" y="0" width="84" height="34" rx="8" fill="#162036" stroke="#10b981" stroke-opacity="0.6"/>
      <circle cx="286" cy="17" r="3.5" fill="#10b981"/><text x="296" y="21.5" class="pill">Supabase</text>

      <rect x="364" y="0" width="66" height="34" rx="8" fill="#162036" stroke="#00e599" stroke-opacity="0.6"/>
      <circle cx="377" cy="17" r="3.5" fill="#00e599"/><text x="387" y="21.5" class="pill">Neon</text>

      <rect x="437" y="0" width="90" height="34" rx="8" fill="#162036" stroke="#f97316" stroke-opacity="0.6"/>
      <text x="482" y="21.5" text-anchor="middle" class="pill">Cloudflare</text>
    </g>
  </g>

  <!-- Quadrant 4: Tools & Platforms -->
  <g transform="translate(560, 118)">
    <rect width="540" height="102" rx="14" fill="url(#boxBg)" stroke="#ec4899" stroke-opacity="0.35" stroke-width="1.4"/>
    <circle cx="22" cy="24" r="4" fill="#ec4899"><animate attributeName="opacity" values="1;0.3;1" dur="2.1s" repeatCount="indefinite"/></circle>
    <text x="34" y="29" class="cat" fill="#fbcfe8">DEVOPS, CLOUD &amp; TOOLING</text>

    <g transform="translate(18, 46)">
      <rect x="0" y="0" width="84" height="34" rx="8" fill="#162036" stroke="#e2e8f0" stroke-opacity="0.45"/>
      <circle cx="13" cy="17" r="3.5" fill="#e2e8f0"/><text x="23" y="21.5" class="pill">Railway</text>

      <rect x="94" y="0" width="60" height="34" rx="8" fill="#162036" stroke="#ef4444" stroke-opacity="0.6"/>
      <circle cx="107" cy="17" r="3.5" fill="#ef4444"/><text x="117" y="21.5" class="pill">Git</text>

      <rect x="164" y="0" width="80" height="34" rx="8" fill="#162036" stroke="#94a3b8" stroke-opacity="0.6"/>
      <circle cx="177" cy="17" r="3.5" fill="#f8fafc"/><text x="187" y="21.5" class="pill">GitHub</text>

      <rect x="254" y="0" width="86" height="34" rx="8" fill="#162036" stroke="#f97316" stroke-opacity="0.6"/>
      <circle cx="267" cy="17" r="3.5" fill="#f97316"/><text x="277" y="21.5" class="pill">Postman</text>

      <rect x="350" y="0" width="80" height="34" rx="8" fill="#162036" stroke="#38bdf8" stroke-opacity="0.6"/>
      <circle cx="363" cy="17" r="3.5" fill="#38bdf8"/><text x="373" y="21.5" class="pill">Docker</text>

      <rect x="440" y="0" width="82" height="34" rx="8" fill="#162036" stroke="#0ea5e9" stroke-opacity="0.6"/>
      <text x="481" y="21.5" text-anchor="middle" class="pill">VS Code</text>
    </g>
  </g>
</svg>
