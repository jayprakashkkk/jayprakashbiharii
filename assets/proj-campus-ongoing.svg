<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 190" width="540" height="190" role="img" aria-label="CampUs (Ongoing Project)">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#052915"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <clipPath id="c"><rect width="540" height="190" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="540" height="190" fill="url(#g)"/>
    <g stroke="#4ade80" stroke-width="1.5" stroke-opacity="0.45">
      <line x1="425" y1="34" x2="480" y2="57"/><line x1="480" y1="57" x2="440" y2="84"/>
      <line x1="425" y1="34" x2="498" y2="28"/><line x1="480" y1="57" x2="505" y2="87"/>
    </g>
    <circle cx="425" cy="34" r="6" fill="#22c55e"><animate attributeName="r" values="5;8;5" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="480" cy="57" r="8" fill="#4ade80"><animate attributeName="r" values="7;10;7" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="440" cy="84" r="5" fill="#86efac"/><circle cx="498" cy="28" r="5" fill="#34d399"/><circle cx="505" cy="87" r="6" fill="#10b981"/>

    <rect x="22" y="18" width="138" height="22" rx="11" fill="#22c55e" fill-opacity="0.2" stroke="#4ade80" stroke-opacity="0.65"/>
    <text x="91" y="33" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="10.5" font-weight="700" fill="#86efac">SPRING BOOT • P2P</text>

    <text x="22" y="72" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="25" font-weight="800" fill="#f8fafc">🎓 CampUs</text>
    <text x="176" y="70" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="700" fill="#fde047">(Ongoing Project)</text>
    <text x="22" y="102" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="13.5" fill="#cbd5e1">Campus platform with Lost &amp; Found claim verification,</text>
    <text x="22" y="122" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="13.5" fill="#cbd5e1">student P2P marketplace, and karma leaderboards.</text>

    <g transform="translate(22, 144)" font-family="ui-monospace, Menlo, monospace" font-size="11.5" font-weight="700" fill="#bbf7d0">
