      <rect x="78" y="0" width="102" height="26" rx="7" fill="#0d3320" stroke="#4ade80" stroke-opacity="0.5"/><text x="129" y="17" text-anchor="middle">Spring Boot</text>
      <rect x="188" y="0" width="94" height="26" rx="7" fill="#0d3320" stroke="#4ade80" stroke-opacity="0.5"/><text x="235" y="17" text-anchor="middle">PostgreSQL</text>
      <rect x="290" y="0" width="76" height="26" rx="7" fill="#0d3320" stroke="#4ade80" stroke-opacity="0.5"/><text x="328" y="17" text-anchor="middle">Railway</text>
    </g>
    <rect x="1" y="1" width="538" height="188" rx="14" fill="none" stroke="#4ade80" stroke-opacity="0.4" stroke-width="1.4"/>
