<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 58" width="1200" height="58" role="img" aria-label="02 Tech Stack and Engineering Pillars">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0b1224"/>
      <stop offset="55%" stop-color="#151536"/>
      <stop offset="100%" stop-color="#0b1224" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="58" rx="12" fill="url(#bg)"/>
  <rect x="0" y="55" width="1200" height="3" rx="1.5" fill="url(#line)"/>
  <circle cx="28" cy="29" r="5" fill="#a855f7">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <text x="48" y="35" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700" fill="#c084fc" letter-spacing="1.5">02 //</text>
  <text x="102" y="36" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="22" font-weight="800" fill="#f8fafc">TECH ARSENAL &amp; ENGINEERING PILLARS</text>
  <circle cx="1120" cy="29" r="4" fill="#ec4899">
    <animate attributeName="cx" values="920;1160;920" dur="5.2s" repeatCount="indefinite"/>
  </circle>
