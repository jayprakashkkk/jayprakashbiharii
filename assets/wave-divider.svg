<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 14" width="1200" height="14" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="divGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="15%" stop-color="#38bdf8" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="1"/>
      <stop offset="85%" stop-color="#ec4899" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="pulseDot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="45%" stop-color="#38bdf8" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <line x1="10" y1="7" x2="1190" y2="7" stroke="url(#divGrad)" stroke-width="2" stroke-linecap="round"/>
  <circle cx="60" cy="7" r="5" fill="url(#pulseDot)">
    <animate attributeName="cx" values="60;1140;60" dur="5s" repeatCount="indefinite"/>
  </circle>
  <polygon points="600,2 605,7 600,12 595,7" fill="#8b5cf6"/>
</svg>
