<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 32" width="1200" height="32" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="divGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0"/>
      <stop offset="20%" stop-color="#38bdf8" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.9"/>
      <stop offset="80%" stop-color="#ec4899" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="pulseDot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="40%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Base Glowing Gradient Line -->
  <line x1="20" y1="16" x2="1180" y2="16" stroke="url(#divGrad)" stroke-width="2" stroke-linecap="round"/>

  <!-- Traveling Light Pulse -->
  <circle cx="0" cy="16" r="10" fill="url(#pulseDot)">
    <animate attributeName="cx" values="60;1140;60" dur="5.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Center Diamond Accent -->
  <polygon points="600,9 607,16 600,23 593,16" fill="#a855f7" opacity="0.9">
    <animate attributeName="opacity" values="0.45;1;0.45" dur="2.5s" repeatCount="indefinite"/>
  </polygon>
</svg>
