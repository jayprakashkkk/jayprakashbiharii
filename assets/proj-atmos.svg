<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 190" width="540" height="190" role="img" aria-label="Atmos Weather">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#072236"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <clipPath id="c"><rect width="540" height="190" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="540" height="190" fill="url(#g)"/>
    <circle cx="465" cy="48" r="24" fill="#fbbf24" opacity="0.25">
      <animate attributeName="r" values="22;27;22" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="465" cy="48" r="14" fill="#f59e0b"/>
    <path d="M430,68 Q442,48 462,56 Q478,44 494,60 Q508,62 505,76 L430,76 Z" fill="#e2e8f0" opacity="0.92">
      <animateTransform attributeName="transform" type="translate" values="0,0;-8,0;0,0" dur="4.5s" repeatCount="indefinite"/>
    </path>
    <line x1="446" y1="84" x2="442" y2="96" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"><animate attributeName="opacity" values="0;1;0" dur="1.4s" repeatCount="indefinite"/></line>
    <line x1="468" y1="84" x2="464" y2="96" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"><animate attributeName="opacity" values="0;1;0" dur="1.4s" begin="0.5s" repeatCount="indefinite"/></line>
    <line x1="490" y1="84" x2="486" y2="96" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"><animate attributeName="opacity" values="0;1;0" dur="1.4s" begin="0.9s" repeatCount="indefinite"/></line>

    <rect x="22" y="18" width="118" height="22" rx="11" fill="#0ea5e9" fill-opacity="0.2" stroke="#38bdf8" stroke-opacity="0.65"/>
    <text x="81" y="33" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="10.5" font-weight="700" fill="#7dd3fc">PWA • WEATHER</text>

    <text x="22" y="72" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="25" font-weight="800" fill="#f8fafc">⛅ Atmos Weather</text>
    <text x="22" y="102" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="13.5" fill="#cbd5e1">Meteorological dashboard with animated weather scenes,</text>
    <text x="22" y="122" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="13.5" fill="#cbd5e1">geolocation, hourly/daily forecasts, and live AQI.</text>

    <g transform="translate(22, 144)" font-family="ui-monospace, Menlo, monospace" font-size="11.5" font-weight="700" fill="#bae6fd">
      <rect x="0" y="0" width="66" height="26" rx="7" fill="#0f2942" stroke="#38bdf8" stroke-opacity="0.5"/><text x="33" y="17" text-anchor="middle">HTML5</text>
      <rect x="74" y="0" width="58" height="26" rx="7" fill="#0f2942" stroke="#38bdf8" stroke-opacity="0.5"/><text x="103" y="17" text-anchor="middle">CSS3</text>
      <rect x="140" y="0" width="76" height="26" rx="7" fill="#0f2942" stroke="#38bdf8" stroke-opacity="0.5"/><text x="178" y="17" text-anchor="middle">ES6+ JS</text>
      <rect x="224" y="0" width="52" height="26" rx="7" fill="#0f2942" stroke="#38bdf8" stroke-opacity="0.5"/><text x="250" y="17" text-anchor="middle">PWA</text>
    </g>
    <rect x="1" y="1" width="538" height="188" rx="14" fill="none" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.4"/>
  </g>
