<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 110" width="540" height="110" role="img" aria-label="Nova Pro Calculator">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b0764"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <clipPath id="c"><rect width="540" height="110" rx="12"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="540" height="110" fill="url(#g)"/>
    <!-- Animated Cyber Calc Keypad Motif -->
    <g transform="translate(422, 22)">
      <rect x="0" y="0" width="24" height="24" rx="5" fill="#1e293b" stroke="#f472b6" stroke-opacity="0.6"/>
      <text x="12" y="17" text-anchor="middle" font-family="monospace" font-size="15" font-weight="700" fill="#f472b6">π</text>
      <rect x="32" y="0" width="24" height="24" rx="5" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.6"/>
      <text x="44" y="17" text-anchor="middle" font-family="monospace" font-size="15" font-weight="700" fill="#38bdf8">√</text>
      <rect x="64" y="0" width="24" height="24" rx="5" fill="#1e293b" stroke="#a855f7" stroke-opacity="0.6"/>
      <text x="76" y="17" text-anchor="middle" font-family="monospace" font-size="15" font-weight="700" fill="#a855f7">%</text>
      <rect x="0" y="34" width="88" height="28" rx="6" fill="#ec4899" fill-opacity="0.22" stroke="#f472b6">
        <animate attributeName="stroke-opacity" values="0.35;1;0.35" dur="2.2s" repeatCount="indefinite"/>
      </rect>
      <text x="44" y="53" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="13" font-weight="800" fill="#fbcfe8">8-IN-1</text>
    </g>
    <rect x="22" y="18" width="128" height="22" rx="11" fill="#ec4899" fill-opacity="0.2" stroke="#f472b6" stroke-opacity="0.6"/>
    <text x="86" y="33" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="11" font-weight="700" fill="#fbcfe8">CYBER UI • ENGINE</text>
    <text x="22" y="72" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="25" font-weight="800" fill="#f8fafc">🧮 Nova Pro Calculator</text>
    <text x="22" y="94" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#94a3b8">Scientific • Currency • GST &amp; EMI</text>
    <rect x="1" y="1" width="538" height="108" rx="12" fill="none" stroke="#f472b6" stroke-opacity="0.35"/>
  </g>
</svg>
