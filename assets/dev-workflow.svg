<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 105" width="1100" height="105" role="img" aria-label="Engineering Workflow Pipeline">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#080d1a"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#080d1a"/>
    </linearGradient>
    <linearGradient id="pipe" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="33%" stop-color="#8b5cf6"/>
      <stop offset="66%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <radialGradient id="packet" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    .step { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13.5px; font-weight: 700; fill: #f8fafc; }
    .sub { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10.5px; fill: #94a3b8; }
  </style>

  <rect width="1100" height="105" rx="14" fill="url(#bg)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Pipeline Line -->
  <line x1="110" y1="36" x2="990" y2="36" stroke="url(#pipe)" stroke-width="2.5" stroke-dasharray="6 5" opacity="0.75"/>

  <!-- Traveling Glowing Data Packet -->
  <circle cx="110" cy="36" r="9" fill="url(#packet)">
    <animate attributeName="cx" values="110;990;110" dur="5.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Node 1 -->
  <g transform="translate(110, 36)">
    <circle r="18" fill="#0f172a" stroke="#22d3ee" stroke-width="2"/>
    <text y="6" text-anchor="middle" font-size="16">💡</text>
    <text y="36" text-anchor="middle" class="step">1. Ideate</text>
    <text y="52" text-anchor="middle" class="sub">Problem First</text>
  </g>

  <!-- Node 2 -->
  <g transform="translate(330, 36)">
    <circle r="18" fill="#0f172a" stroke="#6366f1" stroke-width="2"/>
    <text y="6" text-anchor="middle" font-size="16">📐</text>
    <text y="36" text-anchor="middle" class="step">2. Architect</text>
    <text y="52" text-anchor="middle" class="sub">APIs &amp; Schemas</text>
  </g>

  <!-- Node 3 -->
  <g transform="translate(550, 36)">
    <circle r="18" fill="#0f172a" stroke="#a855f7" stroke-width="2"/>
    <text y="6" text-anchor="middle" font-size="16">⚡</text>
    <text y="36" text-anchor="middle" class="step">3. Build Full-Stack</text>
    <text y="52" text-anchor="middle" class="sub">Spring &amp; React</text>
  </g>

  <!-- Node 4 -->
  <g transform="translate(770, 36)">
    <circle r="18" fill="#0f172a" stroke="#ec4899" stroke-width="2"/>
    <text y="6" text-anchor="middle" font-size="16">🎨</text>
    <text y="36" text-anchor="middle" class="step">4. Polish UI/UX</text>
    <text y="52" text-anchor="middle" class="sub">Pixel-Perfect</text>
  </g>

  <!-- Node 5 -->
  <g transform="translate(990, 36)">
    <circle r="18" fill="#0f172a" stroke="#10b981" stroke-width="2">
      <animate attributeName="r" values="17;21;17" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <text y="6" text-anchor="middle" font-size="16">🚀</text>
    <text y="36" text-anchor="middle" class="step">5. Edge Ship</text>
    <text y="52" text-anchor="middle" class="sub">Cloudflare / Railway</text>
  </g>
</svg>
