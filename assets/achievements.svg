<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 130" width="1100" height="130" role="img" aria-label="Developer Milestones &amp; Highlights">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <style>
    .t { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13.5px; font-weight: 700; fill: #f8fafc; }
    .s { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; fill: #94a3b8; }
    .r { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; font-weight: 800; }
  </style>

  <!-- Trophy 1 -->
  <g transform="translate(0, 6)">
    <rect width="170" height="118" rx="12" fill="url(#bg)" stroke="#f59e0b" stroke-opacity="0.45" stroke-width="1.4"/>
    <circle cx="85" cy="40" r="20" fill="#f59e0b" fill-opacity="0.14">
      <animate attributeName="r" values="18;22;18" dur="3s" repeatCount="indefinite"/>
    </circle>
    <text x="85" y="46" text-anchor="middle" font-size="22">🏆</text>
    <text x="85" y="76" text-anchor="middle" class="t">7+ Repositories</text>
    <text x="85" y="94" text-anchor="middle" class="s">Production Projects</text>
    <text x="85" y="109" text-anchor="middle" class="r" fill="url(#gold)">PORTFOLIO</text>
  </g>

  <!-- Trophy 2 -->
  <g transform="translate(186, 6)">
    <rect width="170" height="118" rx="12" fill="url(#bg)" stroke="#38bdf8" stroke-opacity="0.45" stroke-width="1.4"/>
    <circle cx="85" cy="40" r="20" fill="#38bdf8" fill-opacity="0.14">
      <animate attributeName="r" values="18;22;18" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <text x="85" y="46" text-anchor="middle" font-size="22">⚡</text>
    <text x="85" y="76" text-anchor="middle" class="t">Full-Stack SWE</text>
    <text x="85" y="94" text-anchor="middle" class="s">Java • React • SQL</text>
    <text x="85" y="109" text-anchor="middle" class="r" fill="url(#cyan)">CORE STACK</text>
  </g>

  <!-- Trophy 3 -->
  <g transform="translate(372, 6)">
    <rect width="170" height="118" rx="12" fill="url(#bg)" stroke="#a855f7" stroke-opacity="0.45" stroke-width="1.4"/>
    <circle cx="85" cy="40" r="20" fill="#a855f7" fill-opacity="0.14">
      <animate attributeName="r" values="18;22;18" dur="3.8s" repeatCount="indefinite"/>
    </circle>
    <text x="85" y="46" text-anchor="middle" font-size="22">☁️</text>
    <text x="85" y="76" text-anchor="middle" class="t">Edge &amp; Cloud</text>
    <text x="85" y="94" text-anchor="middle" class="s">Cloudflare • Railway</text>
    <text x="85" y="109" text-anchor="middle" class="r" fill="url(#purple)">SERVERLESS</text>
  </g>

  <!-- Trophy 4 -->
  <g transform="translate(558, 6)">
    <rect width="170" height="118" rx="12" fill="url(#bg)" stroke="#10b981" stroke-opacity="0.45" stroke-width="1.4"/>
    <circle cx="85" cy="40" r="20" fill="#10b981" fill-opacity="0.14">
      <animate attributeName="r" values="18;22;18" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <text x="85" y="46" text-anchor="middle" font-size="22">🧠</text>
    <text x="85" y="76" text-anchor="middle" class="t">401+ MCQs App</text>
    <text x="85" y="94" text-anchor="middle" class="s">QuizPro Engine</text>
    <text x="85" y="109" text-anchor="middle" class="r" fill="url(#green)">16 SUBJECTS</text>
  </g>

  <!-- Trophy 5 -->
  <g transform="translate(744, 6)">
    <rect width="170" height="118" rx="12" fill="url(#bg)" stroke="#ec4899" stroke-opacity="0.45" stroke-width="1.4"/>
    <circle cx="85" cy="40" r="20" fill="#ec4899" fill-opacity="0.14">
      <animate attributeName="r" values="18;22;18" dur="3.6s" repeatCount="indefinite"/>
    </circle>
    <text x="85" y="46" text-anchor="middle" font-size="22">🔄</text>
    <text x="85" y="76" text-anchor="middle" class="t">Real-Time Sync</text>
    <text x="85" y="94" text-anchor="middle" class="s">Neon • Supabase</text>
    <text x="85" y="109" text-anchor="middle" class="r" fill="url(#purple)">CLOUD DB</text>
  </g>

  <!-- Trophy 6 -->
  <g transform="translate(930, 6)">
    <rect width="170" height="118" rx="12" fill="url(#bg)" stroke="#22d3ee" stroke-opacity="0.45" stroke-width="1.4"/>
    <circle cx="85" cy="40" r="20" fill="#22d3ee" fill-opacity="0.14">
      <animate attributeName="r" values="18;22;18" dur="2.9s" repeatCount="indefinite"/>
    </circle>
    <text x="85" y="46" text-anchor="middle" font-size="22">✨</text>
    <text x="85" y="76" text-anchor="middle" class="t">Pixel-Perfect UI</text>
    <text x="85" y="94" text-anchor="middle" class="s">PWAs &amp; Motion</text>
    <text x="85" y="109" text-anchor="middle" class="r" fill="url(#cyan)">RESPONSIVE</text>
  </g>
</svg>
